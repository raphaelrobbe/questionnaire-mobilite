name: GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/configure-pages@v5
        id: pages
      - run: bun install --frozen-lockfile
      - run: bunx vitest run
        env:
          DEPLOY_GATE: '1'
          VITE_SHEETS_WEBAPP_URL: ${{ secrets.VITE_SHEETS_WEBAPP_URL }}
      - id: contact
        run: bash scripts/deploy-contact.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          VITE_CONTACT_URL: ${{ secrets.VITE_CONTACT_URL }}
      - run: bun run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SHEETS_WEBAPP_URL: ${{ secrets.VITE_SHEETS_WEBAPP_URL }}
          VITE_ADMIN_WEBAPP_URL: ${{ secrets.VITE_ADMIN_WEBAPP_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          VITE_CONTACT_URL: ${{ steps.contact.outputs.url }}
      - run: cp build/client/index.html build/client/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/client
      - id: deployment
        uses: actions/deploy-pages@v4
